<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>扎烦恼 · 日常仪式原型</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #17110b; }
  body { display: grid; place-items: center; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #stage { position: relative; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; overflow: hidden; box-shadow: 0 0 80px #0008; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; cursor: pointer; }
  #switcher { position: fixed; z-index: 10; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 7px; color: #fff; background: #17131aee; border: 1px solid #ffffff28; border-radius: 999px; box-shadow: 0 10px 32px #0008; backdrop-filter: blur(12px); }
  #switcher button { width: 34px; height: 34px; border: 0; border-radius: 50%; color: #fff; background: #ffffff17; font-size: 20px; cursor: pointer; }
  #switcher button:hover { background: #ffffff2b; }
  #variantLabel { min-width: 138px; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .03em; }
  #prototypeTag { position: absolute; z-index: 2; top: 10px; left: 12px; padding: 5px 8px; color: #fff9; background: #0006; border-radius: 8px; font-size: 10px; pointer-events: none; }
</style>
</head>
<body>
<main id="stage">
  <canvas id="game" width="720" height="1280" aria-label="扎烦恼日常仪式交互原型"></canvas>
  <div id="prototypeTag">THROWAWAY UI PROTOTYPE · v0.7.1</div>
</main>
<nav id="switcher" aria-label="原型版本切换">
  <button id="prev" aria-label="上一个版本">‹</button>
  <span id="variantLabel"></span>
  <button id="next" aria-label="下一个版本">›</button>
</nav>
<script>
'use strict';
/*
  原型问题：哪种信息重心最适合“认领烦恼 → 短促扎破 → 转化 → 怪话 → 七日档案”？
  三种结构在同一路由用 ?variant=A|B|C 切换：A 仪式优先 / B 档案优先 / C 传播优先。
  一条命令运行：在 demo/ 目录执行 python3 -m http.server 8734
  本文件是一次性 HTML 原型；正式版仍应在 Cocos Creator 中重写。
*/

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 720, H = 1280, TAU = Math.PI * 2;
const VARIANTS = {
  A: { name: '仪式优先', accent: '#ef5b47', dark: '#5b2a22', pale: '#fff2d6' },
  B: { name: '档案优先', accent: '#2f8c75', dark: '#183f38', pale: '#edf8e8' },
  C: { name: '传播优先', accent: '#7a5ce0', dark: '#34275f', pale: '#f4efff' },
};
const params = new URLSearchParams(location.search);
const visualTestFrame = params.get('testFrame');
let variant = VARIANTS[params.get('variant')] ? params.get('variant') : 'A';
const WORRIES = [
  { id:'work', short:'活又长出来了', label:'工作量', icon:'▦', color:'#f2a545', prompt:'待办像复制粘贴一样长出来', taunts:['才十二件，不算多吧？','刚做完的那件，又回来了。','今晚也很适合改需求。'], note:['扎完了。活没少，但它现在小声了一点。','今天不是没做完，是它本来就没有尽头。'], relic:'加班灯贴', relicIcon:'✦' },
  { id:'wait', short:'那个红点没来', label:'等回复', icon:'···', color:'#76a7da', prompt:'消息发出去了，心还悬在那里', taunts:['再刷新一次，说不定呢。','对方正在输入……并没有。','已读不回也算一种回复。'], note:['那个红点没出现，不代表你说错了什么。','消息还悬着。今天可以先不用一起悬着。'], relic:'静音小牌', relicIcon:'◌' },
  { id:'tired', short:'没大事，就是累', label:'模糊疲惫', icon:'≈', color:'#ad87bd', prompt:'说不清哪里不对，只剩一点电', taunts:['电量三格，嘴硬满格。','没事，只是所有事一起有点事。','还能动，就先假装精神。'], note:['今天没有大事。累本身已经是一件事。','说不清也没关系，它已经替你皱成一团了。'], relic:'皱皱云', relicIcon:'☁' }
];
const mockWeek = [
  { day:'一', icon:'✦', type:'work', color:'#f2a545' }, { day:'二', icon:'◌', type:'wait', color:'#76a7da' }, { day:'三', icon:null },
  { day:'四', icon:'☁', type:'tired', color:'#ad87bd' }, { day:'五', icon:null }, { day:'六', icon:null }, { day:'日', icon:null }
];
const assetPaths = {
  backgroundV2:'assets/v2/bg-office-evening-v2.png', backgroundFallback:'assets/gen/bg-office.png',
  fallback0:'assets/gen/mon-0.png', fallback1:'assets/gen/mon-1.png', fallback2:'assets/gen/mon-2.png',
  work0:'assets/v2/work-0-v2.png', work1:'assets/v2/work-1-v2.png', work2:'assets/v2/work-2-v2.png',
  wait0:'assets/v2/wait-0-v2.png', wait1:'assets/v2/wait-1-v2.png', wait2:'assets/v2/wait-2-v2.png',
  tired0:'assets/v2/tired-0-v2.png', tired1:'assets/v2/tired-1-v2.png', tired2:'assets/v2/tired-2-v2.png',
  relicwork:'assets/v2/relic-work-v2.png', relicwait:'assets/v2/relic-wait-v2.png', relictired:'assets/v2/relic-tired-v2.png'
};
const imgs = {};
for (const [key,path] of Object.entries(assetPaths)) { const im=new Image(); im.src=path; imgs[key]=im; }
let state = 'select', chosen = null, hits = 0, stateAt = performance.now();
let particles = [], squashX = 1, squashY = 1, monsterRot = 0, hitFlash = 0;
let lastHit = {x:360,y:650}, taunt = '', tauntUntil = 0, noteIndex = 0;
let archive = mockWeek.map(x => ({...x})), shareReady = false, muted = false, AC = null;

function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-clamp(t,0,1),3);
const rand=(a,b)=>a+Math.random()*(b-a);
function font(size,weight=600){ ctx.font=`${weight} ${size}px "PingFang SC","Microsoft YaHei",sans-serif`; }
function text(str,x,y,size,color='#382b22',align='center',weight=600){ ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle'; font(size,weight); ctx.fillText(str,x,y); }
function wrap(str,x,y,maxW,lineH,size,color='#382b22',weight=600){ font(size,weight); ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle'; const chars=[...str]; let line='',lines=[]; for(const ch of chars){ if(ctx.measureText(line+ch).width>maxW&&line){lines.push(line);line=ch;}else line+=ch; } if(line)lines.push(line); lines.forEach((l,i)=>ctx.fillText(l,x,y+(i-(lines.length-1)/2)*lineH)); }

function audio(){ if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(_){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function beep(freq,dur,type='sine',vol=.06,endFreq=null){ const ac=audio(); if(!ac||muted)return; const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(freq,ac.currentTime); if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,ac.currentTime+dur); g.gain.setValueAtTime(vol,ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur); o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur); }
function sfxHit(){beep(420+hits*24,.055,'square',.07,230);}
function sfxSoft(){beep(520,.16,'triangle',.055,760);setTimeout(()=>beep(760,.18,'triangle',.04),90);}
function setState(next){state=next;stateAt=performance.now();console.info('[原型状态]',{variant,state,worry:chosen?.id||null,hits,archive:archive.filter(x=>x.icon).length});}
function resetFlow(){chosen=null;hits=0;particles=[];taunt='';shareReady=false;setState('select');}

function ready(im){return !!(im&&im.complete&&im.naturalWidth);}
function drawImageContain(im,cx,cy,maxW,maxH){const ratio=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight);const w=im.naturalWidth*ratio,h=im.naturalHeight*ratio;ctx.drawImage(im,cx-w/2,cy-h/2,w,h);}
function drawBackground(dim=0){ const im=ready(imgs.backgroundV2)?imgs.backgroundV2:imgs.backgroundFallback; if(ready(im))ctx.drawImage(im,0,0,W,H); else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ead6b0');g.addColorStop(.45,'#d9ae76');g.addColorStop(1,'#9b6037');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);} const glow=ctx.createRadialGradient(530,280,20,530,280,520);glow.addColorStop(0,'rgba(255,211,125,.14)');glow.addColorStop(1,'rgba(255,190,90,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);ctx.fillStyle=`rgba(30,20,14,${dim})`;ctx.fillRect(0,0,W,H); }
function drawTop(step,title){const v=VARIANTS[variant];ctx.fillStyle='#fffdf6e8';rr(ctx,26,42,668,78,20);ctx.fill();ctx.fillStyle=v.accent;rr(ctx,42,59,118,44,13);ctx.fill();text(step,101,81,18,'#fff','center',800);text(title,183,81,22,v.dark,'left',800);text(muted?'×':'♪',658,81,25,v.dark,'center',800);}
function drawRelic(type,x,y,size,fallback,color){const im=imgs[`relic${type}`];if(ready(im)){drawImageContain(im,x,y,size,size);return;}text(fallback||'·',x,y,size*.58,color||'#8b765f','center',800);}
function drawWeek(x,y,gap,compact=false){const size=compact?62:74;archive.forEach((d,i)=>{const bx=x+i*gap;ctx.fillStyle=d.icon?'#fffdf4':'#ffffff86';rr(ctx,bx,y,size,size+24,15);ctx.fill();ctx.strokeStyle=d.icon?(d.color||'#d8b27b'):'#ffffff77';ctx.lineWidth=3;ctx.stroke();text(d.day,bx+size/2,y+17,14,'#6a594b','center',700);if(d.icon)drawRelic(d.type,bx+size/2,y+54,size*.56,d.icon,d.color);else text('·',bx+size/2,y+53,30,'#b8a993','center',800);if(!compact&&i===4)text('今天',bx+size/2,y+size+14,11,'#7b6c5c');});}
function drawPortrait(w,x,y,size){const im=imgs[`${w.id}0`];ctx.save();ctx.fillStyle=w.color+'33';ctx.beginPath();ctx.arc(x,y,size*.46,0,TAU);ctx.fill();if(ready(im)){drawImageContain(im,x,y,size,size);}else{text(w.icon,x,y,size*.32,'#fff','center',900);}ctx.restore();}
function drawChoiceCard(w,x,y,width,height,mode='row'){const v=VARIANTS[variant];ctx.save();ctx.shadowColor='#3a251833';ctx.shadowBlur=16;ctx.shadowOffsetY=7;ctx.fillStyle='#fffaf0';rr(ctx,x,y,width,height,22);ctx.fill();ctx.restore();if(mode==='row'){ctx.fillStyle=w.color;rr(ctx,x+14,y+14,78,height-28,18);ctx.fill();drawPortrait(w,x+53,y+height/2,74);text(w.short,x+112,y+34,23,v.dark,'left',800);text(w.prompt,x+112,y+72,15,'#7b6a5c','left',500);text('认领 ›',x+width-24,y+height/2,15,v.accent,'right',800);}else{ctx.fillStyle=w.color+'2b';rr(ctx,x+14,y+14,width-28,88,18);ctx.fill();drawPortrait(w,x+width/2,y+58,96);wrap(w.short,x+width/2,y+128,width-25,24,18,v.dark,800);}}

function drawSelectA(){drawBackground(.28);drawTop('1 / 5','认领今天这件破事');ctx.fillStyle='#fff5dae8';rr(ctx,50,154,620,790,32);ctx.fill();text('今天主要是哪一件？',360,216,36,'#4c3527','center',900);text('不用解释，先替它取个名字。',360,263,18,'#846f5e','center',500);WORRIES.forEach((w,i)=>drawChoiceCard(w,78,320+i*155,564,122,'row'));ctx.fillStyle='#7d6950';rr(ctx,154,814,412,62,18);ctx.fill();text('今天没力气细选，就点这里',360,845,17,'#fff8e8','center',700);text('本周已经收好 3 件 · 空一天也没关系',360,913,14,'#7b6a58','center',600);drawWeek(70,990,85,true);}
function drawSelectB(){drawBackground(.1);drawTop('本周','你的烦恼档案');ctx.fillStyle='#edf8e8ee';rr(ctx,42,148,636,470,34);ctx.fill();text('不是连续签到',76,196,15,'#2f8c75','left',800);text('只是看看这周已经过去了什么',76,238,27,'#183f38','left',900);drawWeek(66,300,88,false);text('3 件已经收好',360,458,20,'#2f6759','center',800);ctx.fillStyle='#2f8c75';rr(ctx,150,515,420,70,22);ctx.fill();text('把今天放进空格里',360,550,21,'#fff','center',800);text('从桌上的三张便签里选一张',360,675,17,'#fff7e8','center',700);WORRIES.forEach((w,i)=>drawChoiceCard(w,55+i*218,720+(i%2)*18,190,174,'tile'));ctx.fillStyle='#ffffffc9';rr(ctx,90,945,540,92,24);ctx.fill();text('档案里的物件，都来自你处理过的事',360,982,17,'#31584e','center',700);text('不会因为没来而消失',360,1012,14,'#6e887f','center',500);}
function drawSelectC(){const v=VARIANTS.C;drawBackground(.48);drawTop('今日卡','先选一句别人也懂的');ctx.save();ctx.translate(360,360);ctx.rotate(-.025);ctx.shadowColor='#0007';ctx.shadowBlur=28;ctx.shadowOffsetY=14;ctx.fillStyle='#f7f1ff';rr(ctx,-265,-180,530,360,30);ctx.fill();ctx.restore();text('今日烦恼标本',128,226,15,v.accent,'left',800);text('“',130,310,62,'#b6a4ea','center',900);wrap('今天这件事，有点吵。',360,353,400,48,34,v.dark,900);text('扎小之后，只留下能分享的部分',360,461,15,'#766b8e','center',500);text('哪一句最像今天？',360,603,29,'#fff9f2','center',900);WORRIES.forEach((w,i)=>{const y=665+i*112;ctx.fillStyle=i===0?'#fff7ee':'#ffffffdf';rr(ctx,88,y,544,86,43);ctx.fill();ctx.fillStyle=w.color;ctx.beginPath();ctx.arc(132,y+43,27,0,TAU);ctx.fill();text(w.icon,132,y+43,20,'#fff','center',900);text(w.short,177,y+43,21,v.dark,'left',800);});text('自由输入不会自动出现在分享卡',360,1033,14,'#d8cdef','center',600);}
function drawSelect(){if(variant==='A')drawSelectA();else if(variant==='B')drawSelectB();else drawSelectC();}

function drawParticles(now){particles=particles.filter(p=>now-p.at<p.life);for(const p of particles){const t=(now-p.at)/p.life,x=p.x+p.vx*t,y=p.y+p.vy*t+80*t*t;ctx.globalAlpha=1-t;ctx.fillStyle=p.color;ctx.save();ctx.translate(x,y);ctx.rotate(t*5);ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);ctx.restore();}ctx.globalAlpha=1;}
function monsterImage(indexOverride=null){const idx=indexOverride??(hits<4?0:1),v2=chosen&&imgs[`${chosen.id}${idx}`];if(ready(v2))return v2;const fallback=imgs[`fallback${idx}`];return ready(fallback)?fallback:null;}
function drawMonster(cx,cy,scale=1,alpha=1,imageOverride=null,showLabel=true){const im=imageOverride||monsterImage();ctx.save();ctx.translate(cx,cy);ctx.rotate(monsterRot);ctx.scale(scale*squashX,scale*squashY);ctx.globalAlpha=alpha;if(im){drawImageContain(im,0,-10,440,440);if(hitFlash>.01){ctx.save();ctx.globalAlpha=clamp(hitFlash*1.35,0,.65);ctx.globalCompositeOperation='screen';ctx.filter='brightness(2.3) saturate(.18)';drawImageContain(im,0,-10,440,440);ctx.restore();}}else{ctx.fillStyle=chosen?.color||'#8cbc52';ctx.beginPath();ctx.ellipse(0,0,185,205,0,0,TAU);ctx.fill();text('ಠ ︿ ಠ',0,-15,38,'#3b2b27','center',900);}if(chosen&&showLabel){ctx.globalAlpha=.96;ctx.fillStyle=chosen.color;rr(ctx,-70,125,140,54,18);ctx.fill();text(chosen.label,0,152,18,'#fff','center',800);}ctx.restore();ctx.globalAlpha=1;}
function drawNeedleImpact(x,y,age){const settle=1-ease(clamp(age/100,0,1)),tailX=52+settle*10,tailY=-62-settle*10;ctx.save();ctx.translate(x,y);ctx.lineCap='round';ctx.strokeStyle='#3c2a26';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(tailX,tailY);ctx.stroke();ctx.strokeStyle='#f3e7cf';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(tailX,tailY);ctx.stroke();ctx.fillStyle='#3c2a26';ctx.beginPath();ctx.arc(tailX,tailY,11,0,TAU);ctx.fill();ctx.fillStyle='#ef5b47';ctx.beginPath();ctx.arc(tailX,tailY,8,0,TAU);ctx.fill();ctx.fillStyle='#ffd1a8';ctx.beginPath();ctx.arc(tailX-2,tailY-2,3,0,TAU);ctx.fill();const spark=1-clamp(age/240,0,1);ctx.globalAlpha=spark;ctx.strokeStyle='#fff6c7';ctx.lineWidth=4;for(let i=0;i<4;i++){ctx.rotate(TAU/4);ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(16+spark*5,0);ctx.stroke();}ctx.restore();ctx.globalAlpha=1;}
function drawPlay(now){const v=VARIANTS[variant];drawBackground(.12);drawTop('2 / 5',chosen.short);ctx.fillStyle='#fffdf5d9';rr(ctx,72,148,576,78,22);ctx.fill();text('把它扎小一点',105,180,21,v.dark,'left',800);text(`${hits} / 12`,612,180,18,v.accent,'right',900);for(let i=0;i<12;i++){ctx.fillStyle=i<hits?v.accent:'#d9cdbd';rr(ctx,105+i*42,198,32,9,5);ctx.fill();}drawMonster(360,665,1);if(performance.now()<tauntUntil){ctx.fillStyle='#fffdf5';rr(ctx,335,300,310,76,20);ctx.fill();ctx.beginPath();ctx.moveTo(430,372);ctx.lineTo(455,402);ctx.lineTo(474,370);ctx.fill();wrap(taunt,490,338,270,25,17,'#533d31',700);}text(hits===0?'点怪本体 · 十二下就收工':hits<8?'它已经没刚才那么大声了':'最后几下，准备收尾',360,1035,18,hits===0?'#725f4f':v.dark,'center',800);drawParticles(now);const hitAge=performance.now()-stateAt;if(hits>0&&hitAge<300)drawNeedleImpact(lastHit.x,lastHit.y,hitAge);}
function drawTransform(now){const v=VARIANTS[variant];drawBackground(.25);drawTop('3 / 5','它正在变小');const t=clamp((now-stateAt)/1300,0,1),et=ease(t),mix=ease(clamp((t-.18)/.48,0,1)),cy=665+et*135;drawMonster(360,cy,1-et*.32,1-mix,monsterImage(1),false);if(mix>0)drawMonster(360,cy,1.38-et*.62,mix*.9,monsterImage(2),false);ctx.globalAlpha=ease(clamp((t-.28)/.72,0,1));ctx.fillStyle='#fff8e9';rr(ctx,126,930,468,112,28);ctx.fill();drawRelic(chosen.id,187,986,58,chosen.relicIcon,chosen.color);text(`变成了「${chosen.relic}」`,238,972,24,v.dark,'left',900);text('不是消失，只是暂时没那么占地方。',238,1010,15,'#756557','left',500);ctx.globalAlpha=1;drawParticles(now);if(t>=1&&!drawTransform.advanced){drawTransform.advanced=true;setTimeout(()=>{drawTransform.advanced=false;setState('note');sfxSoft();},180);}}
function drawNote(now){const v=VARIANTS[variant];drawBackground(.48);const t=ease((now-stateAt)/520);ctx.save();ctx.translate(360,600+(1-t)*70);ctx.scale(.92+.08*t,.92+.08*t);ctx.shadowColor='#0006';ctx.shadowBlur=28;ctx.shadowOffsetY=14;ctx.fillStyle=variant==='C'?'#f5efff':'#fffbe9';rr(ctx,-282,-355,564,710,28);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle=chosen.color;ctx.beginPath();ctx.arc(0,-320,13,0,TAU);ctx.fill();text('退场怪话',-235,-276,16,v.accent,'left',800);drawRelic(chosen.id,0,-182,112,chosen.relicIcon,chosen.color);text(chosen.relic,0,-105,20,'#756352','center',700);wrap(chosen.note[noteIndex],0,20,440,48,30,v.dark,900);ctx.strokeStyle='#d9cbb9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-200,138);ctx.lineTo(200,138);ctx.stroke();text('这不是建议，只是今天的怪话。',0,180,15,'#8a7a69','center',500);ctx.fillStyle=v.accent;rr(ctx,-220,248,440,72,23);ctx.fill();text('收进本周',0,284,21,'#fff','center',800);ctx.restore();text('文字完全出现后才开始计算阅读时间',360,1042,13,'#e9dfd2','center',500);}
function drawArchive(){const v=VARIANTS[variant];drawBackground(.18);drawTop('5 / 5','今天已经收好');ctx.fillStyle=variant==='B'?'#edf8e8ef':'#fffaf0ed';rr(ctx,44,150,632,396,32);ctx.fill();text('本周烦恼档案',74,200,27,v.dark,'left',900);text('空一天也不会归零',646,202,14,'#7d7065','right',600);drawWeek(64,258,88,false);text(`${archive.filter(x=>x.icon).length} 件已经变小`,360,441,19,v.accent,'center',800);ctx.fillStyle=shareReady?v.pale:'#ffffffdf';rr(ctx,74,590,572,300,30);ctx.fill();ctx.strokeStyle=shareReady?v.accent:'#d5c9bc';ctx.lineWidth=3;ctx.stroke();text('今日烦恼标本',112,635,14,v.accent,'left',800);drawRelic(chosen.id,160,745,108,chosen.relicIcon,chosen.color);wrap(chosen.note[noteIndex],397,726,390,37,23,v.dark,900);text(`— ${chosen.label} · 已经缩小`,397,826,14,'#7e6f65','center',600);if(shareReady)text('已生成 · 只包含标准类别和怪话',360,923,14,v.accent,'center',700);ctx.fillStyle=v.accent;rr(ctx,105,962,510,70,23);ctx.fill();text(shareReady?'共鸣卡已准备好':'生成脱敏共鸣卡',360,997,20,'#fff','center',800);ctx.fillStyle='#ffffffd9';rr(ctx,180,1055,360,62,20);ctx.fill();text('再处理一件',360,1086,17,v.dark,'center',800);text('本原型不上传、不保存自由输入',360,1160,13,'#efe5da','center',500);}
function render(now){ctx.clearRect(0,0,W,H);if(state==='select')drawSelect();else if(state==='play')drawPlay(now);else if(state==='transform')drawTransform(now);else if(state==='note')drawNote(now);else drawArchive(now);squashX+=(1-squashX)*.18;squashY+=(1-squashY)*.18;monsterRot*=.82;hitFlash*=.76;if(!visualTestFrame)requestAnimationFrame(render);}

function pos(e){const r=cvs.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function inside(p,x,y,w,h){return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;}
function chooseWorry(index){chosen=WORRIES[index];noteIndex=Math.floor(Math.random()*chosen.note.length);hits=0;particles=[];sfxSoft();setState('play');}
function handleSelect(p){if(variant==='A'){for(let i=0;i<3;i++)if(inside(p,78,320+i*155,564,122))return chooseWorry(i);if(inside(p,154,814,412,62))return chooseWorry(2);}else if(variant==='B'){for(let i=0;i<3;i++)if(inside(p,55+i*218,700,190,220))return chooseWorry(i);}else{for(let i=0;i<3;i++)if(inside(p,88,665+i*112,544,86))return chooseWorry(i);}}
function hitMonster(p){if(!inside(p,145,380,430,520))return;hits++;stateAt=performance.now();lastHit=p;sfxHit();squashX=rand(.80,.90);squashY=rand(1.09,1.17);monsterRot=rand(-.055,.055);hitFlash=.42;for(let i=0;i<9;i++)particles.push({x:p.x,y:p.y,vx:rand(-150,150),vy:rand(-170,20),s:rand(6,13),color:[chosen.color,'#ffe36b','#ffffff'][i%3],at:performance.now(),life:rand(420,760)});if([3,6,9].includes(hits)){taunt=chosen.taunts[hits/3-1];tauntUntil=performance.now()+1100;}if(hits>=12){for(let i=0;i<50;i++)particles.push({x:360,y:650,vx:rand(-340,340),vy:rand(-360,80),s:rand(7,18),color:[chosen.color,'#ffe36b','#f8c3cf','#ffffff'][i%4],at:performance.now(),life:rand(700,1400)});beep(180,.35,'sine',.12,70);setState('transform');}}
cvs.addEventListener('pointerdown',e=>{const p=pos(e);if(p.x>620&&p.y<130){muted=!muted;return;}if(state==='select')handleSelect(p);else if(state==='play')hitMonster(p);else if(state==='note'&&performance.now()-stateAt>700){archive[4]={day:'五',icon:chosen.relicIcon,type:chosen.id,color:chosen.color};setState('archive');}else if(state==='archive'){if(inside(p,105,962,510,70)){shareReady=true;sfxSoft();}else if(inside(p,180,1055,360,62))resetFlow();}});
function updateSwitcher(){document.getElementById('variantLabel').textContent=`${variant} — ${VARIANTS[variant].name}`;params.set('variant',variant);history.replaceState(null,'',`${location.pathname}?${params}`);resetFlow();}
function cycle(dir){const keys=Object.keys(VARIANTS);variant=keys[(keys.indexOf(variant)+dir+keys.length)%keys.length];updateSwitcher();}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);
addEventListener('keydown',e=>{const tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA'].includes(tag)||document.activeElement?.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);});
document.getElementById('variantLabel').textContent=`${variant} — ${VARIANTS[variant].name}`;
if(['hit7','clean7'].includes(visualTestFrame)){chosen=WORRIES[2];hits=7;state='play';stateAt=performance.now();lastHit={x:360,y:630};hitFlash=visualTestFrame==='hit7'?.42:0;}
console.info('[原型启动]',{question:'哪种信息重心最适合新的日常烦恼仪式？',variant,state});
if(visualTestFrame){Promise.all(Object.values(imgs).map(im=>new Promise(resolve=>{if(im.complete)resolve();else{im.addEventListener('load',resolve,{once:true});im.addEventListener('error',resolve,{once:true});}}))).then(()=>render(performance.now()));}else requestAnimationFrame(render);
</script>
