    touch-action: none; -webkit-user-select: none; user-select: none; }

<body>
<canvas id="game" width="720" height="1280"></canvas>
<script>
'use strict';
/* ============================================================
   「扎烦恼」第 1 关垂直切片样片（一次性原型，正式版为 Cocos Creator）
   验证目标：点戳手感 / 怨气-金币循环 / 遗言便签机制 / 便签停留埋点
   ============================================================ */

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false; // 像素放大必须禁用平滑
const W = 720, H = 1280;

/* ---------- 自适应缩放 ---------- */
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cvs.style.width = (W * s) + 'px';
  cvs.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- 工具 ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;
const ease = t => 1 - Math.pow(1 - t, 3);          // easeOutCubic
const back = t => { const c = 1.70158 + 1; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }; // easeOutBack

function rr(c, x, y, w, h, r) { // rounded rect path
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ---------- 音效（WebAudio 合成，无素材） ---------- */
let AC = null, muted = false;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq, dur, type, vol, slideTo) {
  const ac = audio(); if (!ac || muted) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function boom() {
  const ac = audio(); if (!ac || muted) return;
  const n = ac.sampleRate * 0.55, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.8);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 750;
  const g = ac.createGain(); g.gain.value = 0.42;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
  beep(150, 0.4, 'sine', 0.32, 50);
  setTimeout(() => beep(600, 0.25, 'triangle', 0.14, 150), 60); // 爆裂后的余韵
}
const sfx = {
  poke: c => beep(360 + Math.min(c, 30) * 14, 0.06, 'square', 0.10, 200),
  coin: () => beep(1100, 0.09, 'sine', 0.10, 1500),
  note: () => { beep(660, 0.14, 'triangle', 0.10); setTimeout(() => beep(880, 0.2, 'triangle', 0.10), 110); },
  ui:   () => beep(300, 0.05, 'square', 0.08),
};

/* ---------- 埋点（便签停留） ---------- */
const DWELL_KEY = 'zzfn_dwell_v1';
function recordDwell(sec) {
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(DWELL_KEY) || '[]'); } catch (e) {}
  arr.push(Math.round(sec * 10) / 10);
  if (arr.length > 50) arr = arr.slice(-50);
  try { localStorage.setItem(DWELL_KEY, JSON.stringify(arr)); } catch (e) {}
  console.info('[埋点] 便签停留', sec.toFixed(1) + 's', '累计样本', arr.length);
  return arr;
}

/* ---------- 背景（静态，离屏一次） ---------- */
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(function drawBG() {
  const c = bg.getContext('2d');
  // 墙
  c.fillStyle = '#f2e3c2'; c.fillRect(0, 0, W, 470);
  c.fillStyle = '#ead6ae';
  for (let x = 0; x < W; x += 90) c.fillRect(x, 0, 4, 470);
  // 踢脚线 + 桌沿
  c.fillStyle = '#d9b98a'; c.fillRect(0, 460, W, 12);
  c.fillStyle = '#a9763f'; c.fillRect(0, 470, W, 8);
  // 桌面木纹
  c.fillStyle = '#cf9a5e'; c.fillRect(0, 478, W, H - 478);
  c.strokeStyle = '#b8834a'; c.lineWidth = 4;
  for (let y = 560; y < H; y += 92) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  c.fillStyle = '#c08c50';
  for (let i = 0; i < 60; i++) c.fillRect(rand(0, W), rand(500, H - 30), rand(20, 60), 3);
  // 显示器/笔记本（左）
  c.fillStyle = '#1c1c24'; rr(c, -30, 150, 230, 430, 14); c.fill();
  c.fillStyle = '#2e3547'; c.fillRect(-14, 170, 190, 380);
  c.fillStyle = '#3b4a6b';
  for (let y = 200; y < 520; y += 34) c.fillRect(-6, y, 160, 8); // 屏幕上模糊的表格
  c.fillStyle = '#4b4b56'; rr(c, -30, 580, 250, 150, 12); c.fill();
  c.fillStyle = '#3c3c46';
  for (let x = 0; x < 190; x += 26) for (let y = 600; y < 710; y += 24) c.fillRect(x, y, 18, 14);
  // 便签（墙上）
  function note(x, y, s, ang, color, draw) {
    c.save(); c.translate(x, y); c.rotate(ang);
    c.fillStyle = color; c.fillRect(-s / 2, -s / 2, s, s);
    c.fillStyle = 'rgba(0,0,0,0.08)'; c.fillRect(-s / 2, s / 2 - 8, s, 8);
    c.fillStyle = '#e53935'; c.beginPath(); c.arc(0, -s / 2 + 8, 7, 0, TAU); c.fill();
    draw(c); c.restore();
  }
  note(268, 210, 84, -0.06, '#f7d94c', c => { // 黄：表情涂鸦
    c.strokeStyle = '#7a6410'; c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.arc(-16, -6, 5, 0, TAU); c.arc(16, -6, 5, 0, TAU); c.stroke();
    c.fillStyle = '#7a6410'; c.fillRect(-8, 12, 16, 5);
  });
  note(382, 235, 92, 0.05, '#f2a7c3', c => { // 粉：加油！
    c.fillStyle = '#c23a62'; c.font = '900 30px "PingFang SC","Microsoft YaHei",sans-serif';
    c.textAlign = 'center'; c.fillText('加油!', 0, -4);
    c.font = '24px sans-serif'; c.fillText('♥', 0, 28);
  });
  note(300, 330, 66, -0.08, '#a8c8e8', c => { // 蓝：生气脸
    c.strokeStyle = '#3a5a7a'; c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-20, -8); c.lineTo(-8, -2); c.moveTo(20, -8); c.lineTo(8, -2); c.stroke();
    c.beginPath(); c.arc(0, 14, 7, Math.PI, TAU); c.stroke();
  });
  // 绿植
  c.fillStyle = '#c98d4e'; rr(c, 428, 470, 76, 62, 8); c.fill();
  c.fillStyle = '#b57a3c'; c.fillRect(420, 470, 92, 14);
  c.fillStyle = '#4e7d3a';
  [[466, 430, 16, 34], [438, 440, 13, 28], [494, 440, 13, 28], [452, 415, 12, 26], [480, 415, 12, 26]]
    .forEach(([x, y, w, h]) => { c.beginPath(); c.ellipse(x, y, w, h / 2, 0, 0, TAU); c.fill(); });
  // 熊熊马克杯（右）
  c.fillStyle = '#f7f2e6'; rr(c, 556, 470, 158, 148, 18); c.fill();
  c.strokeStyle = '#e4dcc8'; c.lineWidth = 6; rr(c, 556, 470, 158, 148, 18); c.stroke();
  c.beginPath(); c.arc(724, 540, 30, -Math.PI / 2, Math.PI / 2); c.strokeStyle = '#f7f2e6'; c.lineWidth = 16; c.stroke();
  c.fillStyle = '#4a2e1a'; c.beginPath(); c.ellipse(635, 474, 72, 16, 0, 0, TAU); c.fill();
  c.fillStyle = '#c8956c'; // 熊脸
  c.beginPath(); c.arc(608, 520, 14, 0, TAU); c.arc(664, 520, 14, 0, TAU); c.fill();
  c.beginPath(); c.arc(636, 545, 26, 0, TAU); c.fill();
  c.fillStyle = '#5a3a22';
  c.beginPath(); c.arc(626, 538, 3.5, 0, TAU); c.arc(648, 538, 3.5, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(637, 552, 6, 4.5, 0, 0, TAU); c.fill();
  // 文件筐/书立（右上）
  c.fillStyle = '#d487b5'; c.fillRect(646, 150, 36, 320);
  c.fillStyle = '#7e9bd0'; c.fillRect(686, 180, 34, 290);
  c.fillStyle = '#9b7fc0'; c.fillRect(660, 120, 30, 350);
  c.fillStyle = 'rgba(255,255,255,0.75)';
  c.fillRect(652, 200, 24, 44); c.fillRect(692, 230, 22, 40); c.fillRect(664, 170, 20, 38);
  // 左下：线圈本 + 笔
  c.fillStyle = '#f4ecd8'; rr(c, -20, 1140, 190, 160, 10); c.fill();
  c.strokeStyle = '#c9bfa4'; c.lineWidth = 3;
  for (let y = 1165; y < 1300; y += 26) { c.beginPath(); c.moveTo(-10, y); c.lineTo(155, y); c.stroke(); }
  c.fillStyle = '#8a8a94';
  for (let x = -10; x < 170; x += 24) { c.beginPath(); c.arc(x + 6, 1146, 5, 0, TAU); c.fill(); }
  c.save(); c.translate(190, 1235); c.rotate(-0.5);
  c.fillStyle = '#3a3a44'; rr(c, 0, -7, 150, 14, 7); c.fill();
  c.fillStyle = '#d487b5'; rr(c, 138, -7, 16, 14, 4); c.fill(); c.restore();
  // 橡皮
  c.fillStyle = '#f2a0b5'; rr(c, 210, 1190, 56, 30, 6); c.fill();
  c.fillStyle = '#7ec4e8'; rr(c, 226, 1212, 56, 30, 6); c.fill();
  // 右下：便签砖 + 回形针
  c.fillStyle = '#f2d98c'; rr(c, 610, 1150, 110, 120, 8); c.fill();
  c.fillStyle = '#e8c96a'; rr(c, 616, 1160, 98, 50, 6); c.fill();
  c.strokeStyle = '#e57a9a'; c.lineWidth = 6;
  c.beginPath(); c.arc(655, 1180, 14, Math.PI, TAU); c.arc(669, 1180, 14, 0, Math.PI); c.stroke();
})();

/* ---------- 周一虫（低清离屏 → 像素放大） ---------- */
const MS = 9;                      // 低清像素放大倍数
const MON_W = 56, MON_H = 50;      // 低清格子数
const monCvs = document.createElement('canvas'); monCvs.width = MON_W; monCvs.height = MON_H;
const COL = {
  body: '#94c356', rim: '#4a7028', spike: '#5e8f36', belly: '#f2e8c9',
  tie: '#5c5c66', tieK: '#45454e', blush: '#f2a0b5', dark: '#262a18', white: '#ffffff',
};
(function buildMonster(angryLevel = 0) { // angryLevel 0/1/2 改眉毛嘴
  const c = monCvs.getContext('2d');
  c.clearRect(0, 0, MON_W, MON_H);
  const E = (x, y, rx, ry, col) => { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill(); };
  // 背鳍（三根清晰小尖刺 + 两侧各一小刺，扎进身体轮廓）
  E(16, 10, 4.5, 4.5, COL.spike); E(28, 6, 5, 5, COL.spike); E(40, 10, 4.5, 4.5, COL.spike);
  E(7, 18, 3.5, 3.5, COL.spike); E(49, 18, 3.5, 3.5, COL.spike);
  // 身体（外圈深色描边 → 内体）
  E(28, 29, 26, 21, COL.rim);
  E(28, 30, 24.4, 19.4, COL.body);
  // 手手（两侧小圆爪，往里收避免像挂球）
  E(6.5, 35, 4.5, 5.5, COL.rim); E(49.5, 35, 4.5, 5.5, COL.rim);
  E(6.5, 35, 3.2, 4.4, COL.body); E(49.5, 35, 3.2, 4.4, COL.body);
  // 脚
  E(18, 48.5, 7, 3.5, COL.rim); E(38, 48.5, 7, 3.5, COL.rim);
  E(18, 48, 5.6, 2.4, COL.body); E(38, 48, 5.6, 2.4, COL.body);
  // 肚皮（小、低，不挤占脸部）
  E(28, 41, 10.5, 6.8, COL.rim);
  E(28, 41.5, 9.2, 5.6, COL.belly);
  // 高光
  c.fillStyle = 'rgba(255,255,255,0.5)';
  c.fillRect(14, 14, 4, 2); c.fillRect(12, 16, 2, 4);
  // 领带
  c.fillStyle = COL.tieK; c.fillRect(25, 27, 6, 4);           // 结
  c.fillStyle = COL.tie;
  for (let i = 0; i < 9; i++) {                               // 领带身（菱形收尖）
    const w = i < 4 ? 2 + i : 9 - i + 3;
    c.fillRect(Math.round(28 - w / 2), 31 + i, w, 1);
  }
  // 脸部（含各怨气阶段表情）统一由 buildMonsterAt 绘制，避免两份代码漂移
})();
// 三个怨气阶段的脸（预渲染三张）
const monFaces = [0, 1, 2].map(lv => {
  const cv = document.createElement('canvas'); cv.width = MON_W; cv.height = MON_H;
  buildMonsterAt(lv, cv);
  return cv;
});
function buildMonsterAt(lv, cv) {
  const c = cv.getContext('2d');
  c.drawImage(monCvs, 0, 0); // 底图（无脸的身体）
  c.fillStyle = COL.dark;
  c.fillRect(16, 17, 5, 5); c.fillRect(35, 17, 5, 5);          // 眼
  c.fillStyle = COL.white;
  c.fillRect(17, 18, 1.6, 1.6); c.fillRect(36, 18, 1.6, 1.6);  // 眼中高光
  c.fillStyle = COL.dark;                                       // 生气眉（粗、压着眼睛）
  c.fillRect(15, 12.5, 7, 2.6); c.fillRect(34, 12.5, 7, 2.6);
  c.fillRect(20.5, 14.5, 2.6, 2.4); c.fillRect(32.9, 14.5, 2.6, 2.4);
  c.fillStyle = COL.blush;                                      // 腮红
  c.fillRect(10, 25, 5, 3); c.fillRect(41, 25, 5, 3);
  c.fillStyle = COL.dark;                                       // 嘴：不爽撇嘴（嘴角向下），在领带结上方
  if (lv === 0) { c.fillRect(25, 24, 6, 1.6); c.fillRect(23.8, 25.2, 1.6, 1.6); c.fillRect(30.6, 25.2, 1.6, 1.6); }
  else if (lv === 1) { c.fillRect(24, 23.5, 8, 1.6); c.fillRect(22.8, 24.8, 1.6, 2.2); c.fillRect(31.6, 24.8, 1.6, 2.2); }
  else { c.fillRect(23, 23.5, 10, 2); c.fillRect(22, 21, 2, 3); c.fillRect(32, 21, 2, 3); c.fillRect(23, 19.5, 2, 2); c.fillRect(31, 19.5, 2, 2); }
}

/* ---------- 外部素材（assets/gen/，归一化产物；有则用，缺图程序绘制兜底） ---------- */
function loadImg(name, onfit) {
  const im = new Image();
  im.onload = () => { im.ok = true; if (onfit) onfit(im); };
  im.src = 'assets/gen/' + name;
  return im;
}
const IMG = {
  bg: loadImg('bg-office.png'),
  mon: [0, 1, 2].map(i => loadImg('mon-' + i + '.png', im => {
    im.dh = MON_H * MS; im.dw = Math.round(MON_H * MS * im.naturalWidth / im.naturalHeight);
  })),
  coin: loadImg('coin.png'),
  needle: loadImg('needle.png'),
  decor: { frame: loadImg('decor-frame.png'), cat: loadImg('decor-cat.png'), rug: loadImg('decor-rug.png') },
};

/* ---------- 游戏状态 ---------- */
const MAX_RAGE = 40;
let state = 'play';           // play | exploding | note | result
let rage = 0, combo = 0, lastPokeT = 0, comboPop = 0;
let shake = 0, flash = 0;
let sqx = 1, sqy = 1;         // 果冻挤压
let monScale = 1, monRot = 0;
let monOffX = 0, monOffY = 0; // 受击位移（自动弹回）
let pokedOnce = false, paused = false;
let explodeT = 0, noteT = 0, noteShownAt = 0;
let particles = [], coinsFly = [];
let needle = null;            // {x,y,t}
let hitStop = 0, pendingBoom = false;   // 最后一击定帧
let zoomPunch = 0;            // 爆炸镜头冲拳
let popText = null;           // "爆!"字
let taunt = null, tauntCd = 0, rageMark = 0, thumpT = 0; // 撩拨 / 终局心跳

// 钱包与桌面装饰（持久化，经济闭环）
const pick = a => a[(Math.random() * a.length) | 0];
function loadNum(k, d) { try { const v = parseFloat(localStorage.getItem(k)); return isNaN(v) ? d : v; } catch (e) { return d; } }
function saveNum(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
let wallet = loadNum('zzfn_wallet', 0), runEarn = 0;
let owned = new Set();
try { owned = new Set(JSON.parse(localStorage.getItem('zzfn_owned') || '[]')); } catch (e) {}
function saveOwned() { try { localStorage.setItem('zzfn_owned', JSON.stringify([...owned])); } catch (e) {} }
const SHOP = [
  { id: 'frame', name: '小恐龙相框', price: 30, x: 118, y: 1030 },
  { id: 'cat',   name: '摆烂小猫摆件', price: 60, x: 560, y: 1048 },
  { id: 'rug',   name: '圆地垫', price: 100, x: 360, y: 1160 },
];

const NOTE_TEXT = ['扎完了？……', '行吧，明天我还来。'];
const NOTE_FROM = '—— 周一虫 · 第 1 关';

// 撩拨台词：欠揍是它上班的一部分（温柔留给遗言便签，这里负责嘴欠）
const TAUNTS = [
  '就这？', '轻了吗？', '痒痒痒！', '上班的怨气就这点？',
  '别停啊，我还没准备好走', 'KPI 我都替你急了', '扎完我你还得开会呢',
  '唔啊——有点上头', '你今天摸鱼了吧？', '力度不行啊，打工人',
];
function provoke(text) { taunt = { text, t: 0 }; tauntCd = 2600; beep(880, 0.07, 'square', 0.08, 1250); }

function startExplosion() {
  state = 'exploding'; explodeT = 0; flash = 0.85; shake = 20; zoomPunch = 0.10;
  boom(); popText = { t: 0 };
  burst(MON_CX, MON_CY, 130, 1.25);
  for (let i = 0; i < 18; i++) spawnCoin(MON_CX + rand(-140, 140), MON_CY + rand(-90, 90));
}

/* ---------- 星星粒子 ---------- */
const PAL = ['#ffd54f', '#f06292', '#4fc3f7', '#aed581', '#ba68c8', '#ffb74d'];
function burst(x, y, n, power) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(0.25, 1) * power;
    particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * 0.35,
      g: 0.0016 * power, rot: rand(0, TAU), vr: rand(-0.2, 0.2),
      size: rand(6, 14) * (power > 0.5 ? 1.3 : 1),
      col: PAL[(Math.random() * PAL.length) | 0],
      star: Math.random() < 0.65, life: rand(500, 950), t: 0,
    });
  }
}
function drawStar(c, r) {
  c.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * TAU / 5;
    c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    const a2 = a + TAU / 10;
    c.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
  }
  c.closePath(); c.fill();
}

/* ---------- 掉落的金币 ---------- */
function spawnCoin(x, y) {
  coinsFly.push({ x, y, sx: x, sy: y, t: 0, dur: rand(420, 560), done: false });
}
function drawCoin(c, x, y, r) {
  if (IMG.coin.ok) { c.drawImage(IMG.coin, x - r, y - r, r * 2, r * 2); return; }
  c.fillStyle = '#e6a817'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  c.fillStyle = '#ffd54f'; c.beginPath(); c.arc(x, y, r * 0.78, 0, TAU); c.fill();
  c.fillStyle = '#e6a817'; c.font = '900 ' + r * 1.1 + 'px sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('¥', x, y + 1);
}

/* ---------- 怨气条 / 顶部 UI ---------- */
let coinPop = 0;
function rageLevel() { return rage >= MAX_RAGE * 0.75 ? 2 : rage >= MAX_RAGE * 0.4 ? 1 : 0; }
function monDims(lv) { // 当前怨气等级的怪物显示尺寸（素材 or 程序绘制）

/* ---------- 主循环 ---------- */
let lastDwell = 0;
let lastT = performance.now();
function loop(t) {
  now = t;
  const dt = Math.min(50, t - lastT); lastT = t;

  // 更新（最后一击定帧期间世界冻结）
  if (hitStop > 0) {
    hitStop -= dt;
    if (hitStop <= 0 && pendingBoom) { pendingBoom = false; startExplosion(); }
  } else {
    sqx += (1 - sqx) * 0.18; sqy += (1 - sqy) * 0.18;
    monRot += (0 - monRot) * 0.14; // 受击歪头自动回正
    shake = Math.max(0, shake - dt * 0.06);
    flash = Math.max(0, flash - dt * 0.0025);
    coinPop = Math.max(0, coinPop - dt * 0.004);
    zoomPunch = Math.max(0, zoomPunch - dt * 0.0004);
    const decay = Math.pow(0.85, dt / 16.7);
    monOffX *= decay; monOffY *= decay;
    if (needle) needle.t += dt / 260;
    tauntCd = Math.max(0, tauntCd - dt);
    if (taunt) { taunt.t += dt; if (taunt.t > 1900) taunt = null; }
    if (popText) { popText.t += dt / 700; if (popText.t > 1) popText = null; }
    if (state === 'play' && rage >= MAX_RAGE * 0.9) { // 终局心跳
      thumpT += dt;
      if (thumpT > 560) { thumpT = 0; beep(70, 0.12, 'sine', 0.22); }
    }
    if (state === 'exploding') {
      explodeT += dt;
      monScale = Math.max(0, 1 - explodeT / 350);
      monRot = Math.sin(explodeT / 30) * 0.1 * monScale;
      if (explodeT > 750) { state = 'note'; noteT = now; noteShownAt = now; sfx.note(); }
    }
    // 粒子
    for (const p of particles) {
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.rot += p.vr * dt;
    }
    particles = particles.filter(p => p.t < p.life);
    // 金币飞行
    for (const cf of coinsFly) {
      cf.t += dt;
      const k = clamp(cf.t / cf.dur, 0, 1), e = ease(k);
      cf.x = cf.sx + (618 - cf.sx) * e;
      cf.y = cf.sy + (82 - cf.sy) * e - Math.sin(k * Math.PI) * 160;
      if (k >= 1 && !cf.done) { cf.done = true; wallet++; runEarn++; saveNum('zzfn_wallet', wallet); coinPop = 1; sfx.coin(); }
    }
    coinsFly = coinsFly.filter(c => !c.done || c.t < c.dur + 300);
  }

  // 绘制
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  if (zoomPunch > 0) { // 爆炸镜头冲拳
    ctx.translate(W / 2, H / 2); ctx.scale(1 + zoomPunch, 1 + zoomPunch); ctx.translate(-W / 2, -H / 2);
  }
  if (IMG.bg.ok) ctx.drawImage(IMG.bg, 0, 0, W, H); else ctx.drawImage(bg, 0, 0);
  drawDecors(); // 你买的桌面装饰
  // 杯口热气（新背景咖啡杯在右下，杯沿约 y545）
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (let i = 0; i < 2; i++) {
    ctx.beginPath();
    for (let k = 0; k <= 20; k++) {
      const yy = 545 - k * 7, xx = 590 + i * 36 + Math.sin(now / 500 + k / 3 + i * 2) * 7;
      k === 0 ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  }
  drawSteam();
  drawMonster();
  drawNeedleStab();
  drawDizzy();
  drawTaunt();
  if (popText) { // 爆炸"爆!"字
    const t = popText.t, sc = back(clamp(t * 1.4, 0, 1));
    const a = t < 0.7 ? 1 : Math.max(0, 1 - (t - 0.7) / 0.3);
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(MON_CX, MON_CY - 120); ctx.rotate(-0.06); ctx.scale(sc, sc);
    ctx.font = '900 120px "PingFang SC",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 16; ctx.strokeStyle = '#4a3418'; ctx.strokeText('爆!', 0, 0);
    ctx.fillStyle = '#ffd54f'; ctx.fillText('爆!', 0, 0);
    ctx.restore(); ctx.textBaseline = 'alphabetic';
  }
  // 粒子
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.col;
    if (p.star) drawStar(ctx, p.size); else { ctx.beginPath(); ctx.arc(0, 0, p.size * 0.5, 0, TAU); ctx.fill(); }
    ctx.restore();
  }
  // 飞行金币
  for (const cf of coinsFly) drawCoin(ctx, cf.x, cf.y, 20);
  // 首次提示
  if (!pokedOnce && state === 'play') {
    ctx.font = '900 42px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(74,52,24,' + (0.55 + 0.45 * Math.sin(now / 300)) + ')';
    ctx.fillText('↑ 点这只怪！戳爆它 ↑', 360, 1080);
  }
  if (state === 'play' && rage >= MAX_RAGE * 0.9) { // 终局临近，边缘泛红
    const a = 0.10 + 0.08 * Math.sin(now / 280);
    const g = ctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 760);
    g.addColorStop(0, 'rgba(120,20,10,0)');
    g.addColorStop(1, 'rgba(120,20,10,' + a + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  drawTopBar();
  if (flash > 0) { ctx.fillStyle = 'rgba(255,250,230,' + flash + ')'; ctx.fillRect(0, 0, W, H); }
  if (state === 'note') drawNoteCard();
  if (state === 'result') drawResult();
  if (paused) drawPause();
  ctx.restore();
  // 样片水印
  ctx.font = '400 18px "PingFang SC",sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillText('扎烦恼 · 第 1 关样片 v0.5（一次性原型，正式版 Cocos Creator）', 360, 1268);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 输入 ---------- */
function canvasPos(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function inBtn(x, y, w, h) { // 结果/暂停界面的按钮热区（相对卡片中心 360,640 / 暂停卡片）
  const p = lastPos; if (!p) return false;
  if (paused) return p.x > 190 && p.x < 530 && p.y > y + 460 && p.y < y + 460 + h;
  return p.x > 360 + x && p.x < 360 + x + w && p.y > 640 + y && p.y < 640 + y + h;
}
let lastPos = null;

cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  audio(); // 首次手势解锁音频
  const p = canvasPos(e); lastPos = p;

  if (paused) {
    if (inBtn(190, 620, 340, 80)) { paused = false; sfx.ui(); }             // 继续
    else if (inBtn(190, 724, 340, 80)) { paused = false; restart(); }       // 重开
    return;
  }
  if (state === 'note') {
    if (now - noteShownAt < NOTE_IGNORE_MS) return; // 入场动画未演完的点击视为误触，防污染停留埋点
    lastDwell = (now - noteShownAt) / 1000;
    recordDwell(lastDwell);
    state = 'result'; sfx.ui();
    return;
  }
  if (state === 'result') {
    // 再扎一次：卡片中心 (360,640)，按钮区 (-220,40,440,100) → 绝对坐标 140..580 / 680..780
    if (p.x > 140 && p.x < 580 && p.y > 680 && p.y < 780) { sfx.ui(); restart(); return; }
    // 我的桌面商店
    for (let i = 0; i < SHOP.length; i++) {
      const bx = 360 - 250 + i * 175, by = 640 + 218;
      if (p.x > bx && p.x < bx + 160 && p.y > by && p.y < by + 205) {
        const it = SHOP[i];
        if (!owned.has(it.id) && wallet >= it.price) {
          wallet -= it.price; saveNum('zzfn_wallet', wallet);
          owned.add(it.id); saveOwned(); sfx.coin();
        } else if (!owned.has(it.id)) {
          beep(150, 0.1, 'square', 0.08); // 金币不足
        }
      }
    }
    return;
  }
  if (state !== 'play') return;

  // 暂停按钮
  if (p.x > 36 && p.x < 124 && p.y > 36 && p.y < 124) { paused = true; sfx.ui(); return; }
  // 静音
  if (p.x < 90 && p.y > 1210) { muted = !muted; return; }

  // 戳怪
  if (pendingBoom || hitStop > 0) return; // 最后一击定帧期间不再接受输入
  const r = monsterRect(), pad = 40;
  if (p.x > r.x - pad && p.x < r.x + r.w + pad && p.y > r.y - pad && p.y < r.y + r.h + pad) {
    pokedOnce = true;
    const t = now;
    combo = (t - lastPokeT < 650) ? combo + 1 : 1;
    lastPokeT = t; comboPop = 1;
    const gain = 1 + (combo > 0 && combo % 5 === 0 ? 1 : 0);
    rage = Math.min(MAX_RAGE, rage + gain);
    needle = { x: p.x, y: p.y, t: 0 };
    burst(p.x, p.y, 6 + (Math.random() * 6 | 0), rand(0.38, 0.55));
    spawnCoin(p.x + rand(-30, 30), p.y);
    if (Math.random() < 0.3) spawnCoin(p.x + rand(-40, 40), p.y);
    // 受击反馈随机化：挤压方向/幅度每次略不同，连点时不产生"同一帧回放"的麻木感
    if (Math.random() < 0.22) { sqx = rand(1.06, 1.15); sqy = rand(0.83, 0.91); } // 偶尔横向压扁
    else { sqx = rand(0.82, 0.90); sqy = rand(1.08, 1.16); }
    // 受击弹开（往远离点击点的方向）+ 随机抖动与小歪头
    monOffX = clamp((MON_CX - p.x) * 0.06 + rand(-5, 5), -18, 18);
    monOffY = clamp((MON_CY - p.y) * 0.045 + rand(-4, 4), -14, 12);
    monRot = rand(-0.05, 0.05);
    shake = (rage >= MAX_RAGE * 0.75 ? 5 : 2) + (Math.random() < 0.3 ? 1 : 0);
    sfx.poke(combo);
    // 撩拨台词：连击节点 / 怨气节点 / 随机嘴欠
    if (combo === 10 || combo === 20 || combo === 30) provoke(pick(TAUNTS));
    else {
      for (const mk of [10, 20, 30]) {
        if (rage >= mk && rageMark < mk) { rageMark = mk; provoke(pick(TAUNTS)); break; }
      }
    }
    if (tauntCd <= 0 && Math.random() < 0.15) provoke(pick(TAUNTS));
    if (rage >= MAX_RAGE) { // 最后一击：定帧 → 大爆炸
      hitStop = 130; pendingBoom = true; flash = 0.3; shake = 9;
      beep(200, 0.14, 'square', 0.22, 55);
    }
  }
});

function restart() {
  state = 'play'; rage = 0; combo = 0; runEarn = 0;
  monScale = 1; monRot = 0; particles = []; coinsFly = [];
  monOffX = 0; monOffY = 0;
  sqx = sqy = 1; pokedOnce = false; flash = 0; shake = 0;
  rageMark = 0; taunt = null; tauntCd = 0; popText = null;
  zoomPunch = 0; hitStop = 0; pendingBoom = false; thumpT = 0;
  notePinPlayed = false;
}
</script>
</body>
</html>
